<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Testing matrix: for each area, what can go wrong and what is tested. Intent routing, source lifecycle, deadlines, mutations, duplicate actions, profiles, deployment. Below it, the loop: bug, reproduce it, write a regression test, fix, run the full suite, deploy, live smoke test.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="820" rx="18" fill="#0f172a"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="600" y="48" font-size="22" font-weight="700" fill="#f1f5f9" text-anchor="middle">What the tests are for</text>
    <text x="600" y="72" font-size="13" fill="#94a3b8" text-anchor="middle">No percentages here. This is what can go wrong, and what a test holds in place.</text>

    <!-- header -->
    <rect x="60" y="96" width="1080" height="40" rx="10" fill="#141d30" stroke="#334155" stroke-width="1.5"/>
    <text x="90" y="122" font-size="13" font-weight="700" fill="#60a5fa" letter-spacing="1">AREA</text>
    <text x="360" y="122" font-size="13" font-weight="700" fill="#60a5fa" letter-spacing="1">WHAT CAN GO WRONG</text>
    <text x="800" y="122" font-size="13" font-weight="700" fill="#60a5fa" letter-spacing="1">WHAT I TEST</text>

    <!-- rows -->
    <g font-size="15" fill="#e2e8f0">
      <rect x="60" y="146" width="1080" height="54" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="179" font-weight="600" fill="#f1f5f9">Intent routing</text>
      <text x="360" y="179" fill="#cbd5e1">"Similar sentences mean different things"</text>
      <text x="800" y="179">Regression phrases, zero-model paths</text>

      <rect x="60" y="208" width="1080" height="54" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="241" font-weight="600" fill="#f1f5f9">Source lifecycle</text>
      <text x="360" y="241" fill="#cbd5e1">"File added, changed or removed"</text>
      <text x="800" y="241">Rebuild and stale-week behavior</text>

      <rect x="60" y="270" width="1080" height="54" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="303" font-weight="600" fill="#f1f5f9">Deadlines</text>
      <text x="360" y="303" fill="#cbd5e1">"Two sources disagree"</text>
      <text x="800" y="303">Evidence resolution, disputes kept</text>

      <rect x="60" y="332" width="1080" height="54" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="365" font-weight="600" fill="#f1f5f9">Mutations</text>
      <text x="360" y="365" fill="#cbd5e1">"The wrong task changes"</text>
      <text x="800" y="365">Preview + confirmation, pinned targets</text>

      <rect x="60" y="394" width="1080" height="54" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="427" font-weight="600" fill="#f1f5f9">Duplicate actions</text>
      <text x="360" y="427" fill="#cbd5e1">"Button pressed twice"</text>
      <text x="800" y="427">Exactly-once behavior</text>

      <rect x="60" y="456" width="1080" height="54" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="489" font-weight="600" fill="#f1f5f9">Profiles</text>
      <text x="360" y="489" fill="#cbd5e1">"One user's data leaks to another"</text>
      <text x="800" y="489">Isolation tests, throwaway profiles</text>

      <rect x="60" y="518" width="1080" height="54" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="551" font-weight="600" fill="#f1f5f9">Deployment</text>
      <text x="360" y="551" fill="#cbd5e1">"Cloud and worker run different versions"</text>
      <text x="800" y="551">Version checks before any job runs</text>
    </g>

    <!-- the loop -->
    <line x1="60" y1="606" x2="1140" y2="606" stroke="#1e293b" stroke-width="2"/>
    <text x="600" y="640" font-size="12" fill="#64748b" letter-spacing="2" text-anchor="middle">HOW MOST OF THEM CAME TO EXIST</text>

    <g font-size="12" fill="#f1f5f9" text-anchor="middle">
      <rect x="60" y="660" width="132" height="58" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="126" y="685" font-weight="600">Bug or weird</text><text x="126" y="702" font-weight="600">behavior</text>
      <line x1="194" y1="689" x2="214" y2="689" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="216" y="660" width="132" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="282" y="693" font-weight="600">Reproduce it</text>
      <line x1="350" y1="689" x2="370" y2="689" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="372" y="660" width="132" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="438" y="685" font-weight="600">Write a</text><text x="438" y="702" font-weight="600">regression test</text>
      <line x1="506" y1="689" x2="526" y2="689" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="528" y="660" width="132" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="594" y="685" font-weight="600">Fix routing</text><text x="594" y="702" font-weight="600">or logic</text>
      <line x1="662" y1="689" x2="682" y2="689" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="684" y="660" width="132" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="750" y="693" font-weight="600">Run full suite</text>
      <line x1="818" y1="689" x2="838" y2="689" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="840" y="660" width="132" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="906" y="693" font-weight="600">Deploy</text>
      <line x1="974" y1="689" x2="994" y2="689" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="996" y="660" width="144" height="58" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="1068" y="685" font-weight="600">Live smoke</text><text x="1068" y="702" font-weight="600">test</text>
    </g>

    <text x="600" y="762" font-size="13" fill="#cbd5e1" text-anchor="middle">A surprising amount of the project became: make the assistant do something weird,</text>
    <text x="600" y="782" font-size="13" fill="#cbd5e1" text-anchor="middle">then make sure it can never do that exact weird thing again.</text>
  </g>
</svg>
