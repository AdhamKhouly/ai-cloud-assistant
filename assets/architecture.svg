<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Architecture: user to Discord to a cloud control plane holding the intent router, canonical state, scheduler, source registry and task and deadline engine; a local worker for generation, transcription and file-aware jobs; source material flowing through source sync into the control plane.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="18" fill="#0f172a"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">

    <!-- USER -->
    <rect x="500" y="36" width="200" height="56" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="536" cy="58" r="7" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 524 78 C 524 68, 548 68, 548 78" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text x="612" y="70" font-size="17" font-weight="600" fill="#f1f5f9">USER</text>
    <line x1="600" y1="92" x2="600" y2="126" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- DISCORD -->
    <rect x="500" y="128" width="200" height="56" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="526" y="146" width="24" height="16" rx="5" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <path d="M 532 162 L 532 168 L 539 162" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linejoin="round"/>
    <text x="616" y="162" font-size="17" font-weight="600" fill="#f1f5f9">DISCORD</text>
    <line x1="600" y1="184" x2="600" y2="238" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="640" y="216" font-size="12" fill="#94a3b8" text-anchor="start">one reply per message</text>

    <!-- CLOUD CONTROL PLANE -->
    <rect x="320" y="240" width="560" height="400" rx="18" fill="#141d30" stroke="#60a5fa" stroke-width="2"/>
    <text x="600" y="274" font-size="19" font-weight="700" fill="#f1f5f9" letter-spacing="1">CLOUD CONTROL PLANE</text>
    <rect x="768" y="256" width="96" height="24" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="816" y="272" font-size="11" fill="#22d3ee" font-weight="600">always on</text>

    <rect x="350" y="300" width="250" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="475" y="332" font-size="16" font-weight="600" fill="#f1f5f9">Intent Router</text>
    <text x="475" y="351" font-size="12" fill="#94a3b8">one typed intent per message</text>

    <rect x="610" y="300" width="250" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="735" y="332" font-size="16" font-weight="600" fill="#f1f5f9">Canonical State</text>
    <text x="735" y="351" font-size="12" fill="#94a3b8">the only writable copy</text>

    <rect x="350" y="386" width="250" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="475" y="418" font-size="16" font-weight="600" fill="#f1f5f9">Scheduler</text>
    <text x="475" y="437" font-size="12" fill="#94a3b8">rebuilds, reminders, maintenance</text>

    <rect x="610" y="386" width="250" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="735" y="418" font-size="16" font-weight="600" fill="#f1f5f9">Source Registry</text>
    <text x="735" y="437" font-size="12" fill="#94a3b8">what exists, what changed, what left</text>

    <rect x="350" y="472" width="510" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="605" y="504" font-size="16" font-weight="600" fill="#f1f5f9">Task / Deadline Engine</text>
    <text x="605" y="523" font-size="12" fill="#94a3b8">evidence in, resolved deadlines and tasks out</text>

    <text x="600" y="590" font-size="13" fill="#94a3b8" font-style="italic">Owns the state. Decides the route. Stays awake.</text>
    <text x="600" y="616" font-size="12" fill="#64748b">deterministic answers come straight from here, no model needed</text>

    <!-- LOCAL WORKER -->
    <rect x="940" y="300" width="220" height="290" rx="18" fill="#141d30" stroke="#22d3ee" stroke-width="2"/>
    <text x="1050" y="332" font-size="17" font-weight="700" fill="#f1f5f9" letter-spacing="1">LOCAL WORKER</text>
    <rect x="1000" y="342" width="100" height="20" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="1050" y="356" font-size="11" fill="#22d3ee" font-weight="600">near the files</text>

    <rect x="960" y="376" width="180" height="56" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="1050" y="400" font-size="15" font-weight="600" fill="#f1f5f9">Generation</text>
    <text x="1050" y="418" font-size="11" fill="#94a3b8">notes, quizzes, explanations</text>

    <rect x="960" y="444" width="180" height="56" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="1050" y="468" font-size="15" font-weight="600" fill="#f1f5f9">Local Transcription</text>
    <text x="1050" y="486" font-size="11" fill="#94a3b8">media never leaves the machine</text>

    <rect x="960" y="512" width="180" height="56" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="1050" y="536" font-size="15" font-weight="600" fill="#f1f5f9">File-Aware Jobs</text>
    <text x="1050" y="554" font-size="11" fill="#94a3b8">anything that reads the documents</text>

    <!-- jobs / results between control plane and worker -->
    <line x1="882" y1="420" x2="936" y2="420" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <text x="909" y="410" font-size="11" fill="#22d3ee">jobs</text>
    <line x1="936" y1="456" x2="884" y2="456" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <text x="909" y="474" font-size="11" fill="#22d3ee">results</text>
    <text x="1050" y="614" font-size="11" fill="#64748b">version-pinned leases, one worker per job</text>

    <!-- SOURCE MATERIAL -> SOURCE SYNC -> CONTROL PLANE -->
    <rect x="40" y="360" width="220" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="62" y="380" width="18" height="22" rx="3" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <rect x="70" y="386" width="18" height="22" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="386" font-size="15" font-weight="600" fill="#f1f5f9" text-anchor="start">SOURCE MATERIAL</text>
    <text x="100" y="406" font-size="11" fill="#94a3b8" text-anchor="start">slides, transcripts, readings</text>
    <line x1="150" y1="424" x2="150" y2="468" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="40" y="470" width="220" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 66 502 a 12 12 0 1 1 4 9" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <path d="M 66 496 L 66 504 L 74 504" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <text x="100" y="496" font-size="15" font-weight="600" fill="#f1f5f9" text-anchor="start">SOURCE SYNC</text>
    <text x="100" y="516" font-size="11" fill="#94a3b8" text-anchor="start">manifest, then batches</text>
    <line x1="260" y1="502" x2="318" y2="502" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="150" y="560" font-size="11" fill="#64748b">deletion is an event, not an absence</text>

    <!-- caption -->
    <line x1="80" y1="672" x2="1120" y2="672" stroke="#1e293b" stroke-width="2"/>
    <text x="600" y="706" font-size="16" fill="#e2e8f0">One writable state. The cloud stays awake; the worker stays close to the files.</text>
    <text x="600" y="730" font-size="12" fill="#64748b">This is the shape of the system, not its deployment. No addresses, hosts or accounts appear here.</text>
  </g>
</svg>
