<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Cloud and local split. Cloud: always awake, canonical state, Discord, scheduling, routing, source registry. Local: files, transcription, generation worker, heavy or local jobs. Center: sync and worker protocol. Caption: cloud adoption did not mean moving everything to the cloud.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="18" fill="#0f172a"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- CLOUD -->
    <rect x="60" y="60" width="440" height="440" rx="18" fill="#141d30" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="106" cy="104" r="9" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="119" cy="97" r="11" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="131" cy="105" r="8" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <text x="156" y="111" font-size="22" font-weight="700" fill="#f1f5f9" letter-spacing="1">CLOUD</text>
    <rect x="240" y="90" width="112" height="24" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="296" y="107" font-size="12" fill="#60a5fa" font-weight="600" text-anchor="middle">must stay awake</text>

    <g font-size="17" fill="#e2e8f0">
      <circle cx="100" cy="164" r="5" fill="#60a5fa"/><text x="120" y="170">Always awake</text>
      <circle cx="100" cy="212" r="5" fill="#60a5fa"/><text x="120" y="218">Canonical state (the only writable copy)</text>
      <circle cx="100" cy="260" r="5" fill="#60a5fa"/><text x="120" y="266">Discord connection</text>
      <circle cx="100" cy="308" r="5" fill="#60a5fa"/><text x="120" y="314">Scheduling and reminders</text>
      <circle cx="100" cy="356" r="5" fill="#60a5fa"/><text x="120" y="362">Intent routing and deterministic answers</text>
      <circle cx="100" cy="404" r="5" fill="#60a5fa"/><text x="120" y="410">Source registry</text>
      <circle cx="100" cy="452" r="5" fill="#60a5fa"/><text x="120" y="458">Worker coordination</text>
    </g>

    <!-- LOCAL -->
    <rect x="700" y="60" width="440" height="440" rx="18" fill="#141d30" stroke="#22d3ee" stroke-width="2"/>
    <rect x="744" y="90" width="30" height="19" rx="2" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <rect x="738" y="111" width="42" height="4" rx="2" fill="#22d3ee"/>
    <text x="796" y="111" font-size="22" font-weight="700" fill="#f1f5f9" letter-spacing="1">LOCAL</text>
    <rect x="880" y="90" width="112" height="24" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="936" y="107" font-size="12" fill="#22d3ee" font-weight="600" text-anchor="middle">near the files</text>

    <g font-size="17" fill="#e2e8f0">
      <circle cx="740" cy="164" r="5" fill="#22d3ee"/><text x="760" y="170">The original files</text>
      <circle cx="740" cy="212" r="5" fill="#22d3ee"/><text x="760" y="218">Recording transcription (media stays here)</text>
      <circle cx="740" cy="260" r="5" fill="#22d3ee"/><text x="760" y="266">Generation worker</text>
      <circle cx="740" cy="308" r="5" fill="#22d3ee"/><text x="760" y="314">Heavy or file-bound jobs</text>
      <circle cx="740" cy="356" r="5" fill="#22d3ee"/><text x="760" y="362">Source watching and sync</text>
      <circle cx="740" cy="404" r="5" fill="#334155"/><text x="760" y="410" fill="#64748b">No second writable database</text>
      <circle cx="740" cy="452" r="5" fill="#334155"/><text x="760" y="458" fill="#64748b">Goes to sleep; the assistant does not</text>
    </g>

    <!-- CENTER -->
    <rect x="530" y="236" width="140" height="104" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="600" y="272" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="middle">SYNC +</text>
    <text x="600" y="294" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="middle">WORKER</text>
    <text x="600" y="316" font-size="15" font-weight="700" fill="#f1f5f9" text-anchor="middle">PROTOCOL</text>

    <line x1="698" y1="186" x2="504" y2="186" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <text x="600" y="176" font-size="11" fill="#22d3ee" text-anchor="middle">source manifests and batches go up</text>

    <line x1="502" y1="380" x2="696" y2="380" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="600" y="370" font-size="11" fill="#60a5fa" text-anchor="middle">jobs are offered down</text>

    <line x1="698" y1="424" x2="504" y2="424" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="600" y="446" font-size="11" fill="#60a5fa" text-anchor="middle">results are reported back</text>
    <text x="600" y="466" font-size="10" fill="#64748b" text-anchor="middle">version-pinned, one worker per job</text>

    <!-- caption -->
    <text x="600" y="566" font-size="21" font-weight="600" fill="#f1f5f9" text-anchor="middle">"Cloud adoption did not mean moving everything to the cloud."</text>
    <text x="600" y="596" font-size="13" fill="#94a3b8" text-anchor="middle">It meant deciding what has to stay awake and what belongs near the files.</text>
  </g>
</svg>
