<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="AI Cloud Assistant. Discord + Cloud + Local Tools + Living Knowledge. A student project for learning how AI agents actually work as systems.">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#334155"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="320" rx="18" fill="#0f172a"/>
  <rect x="700" y="0" width="500" height="320" rx="18" fill="url(#dots)" opacity="0.55"/>
  <rect x="700" y="0" width="60" height="320" fill="#0f172a" opacity="0.9"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="126" font-size="58" font-weight="700" fill="#f1f5f9" letter-spacing="-1">AI Cloud Assistant</text>
    <rect x="66" y="146" width="132" height="4" rx="2" fill="#22d3ee"/>
    <text x="64" y="194" font-size="22" fill="#cbd5e1">Discord + Cloud + Local Tools + Living Knowledge</text>
    <text x="64" y="234" font-size="15" fill="#94a3b8">A student project for learning how AI agents actually work as systems.</text>
  </g>

  <!-- small motif: discord -> cloud -> local, cloud -> notes -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">
    <!-- Discord card -->
    <rect x="770" y="86" width="112" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="792" y="98" width="24" height="16" rx="5" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <path d="M 798 114 L 798 120 L 805 114" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linejoin="round"/>
    <text x="848" y="112" font-weight="600">Discord</text>
    <text x="826" y="134" fill="#94a3b8" font-size="11">the front door</text>

    <!-- Cloud card -->
    <rect x="920" y="86" width="112" height="60" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="946" cy="112" r="7" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="956" cy="106" r="8" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="965" cy="112" r="6" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <text x="1000" y="112" font-weight="600">Cloud</text>
    <text x="976" y="134" fill="#94a3b8" font-size="11">always awake</text>

    <!-- Local card -->
    <rect x="1070" y="86" width="112" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="1090" y="100" width="24" height="15" rx="2" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <rect x="1086" y="116" width="32" height="3" rx="1.5" fill="#60a5fa"/>
    <text x="1148" y="112" font-weight="600">Local</text>
    <text x="1126" y="134" fill="#94a3b8" font-size="11">near the files</text>

    <!-- Notes card under cloud -->
    <rect x="920" y="196" width="112" height="60" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="942" y="210" width="20" height="3" rx="1.5" fill="#f59e0b"/>
    <rect x="942" y="218" width="26" height="3" rx="1.5" fill="#f59e0b"/>
    <rect x="942" y="226" width="16" height="3" rx="1.5" fill="#f59e0b"/>
    <text x="1000" y="222" font-weight="600">Notes</text>
    <text x="976" y="244" fill="#94a3b8" font-size="11">living, versioned</text>

    <!-- arrows -->
    <line x1="882" y1="116" x2="918" y2="116" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1032" y1="116" x2="1068" y2="116" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1068" y1="128" x2="1032" y2="128" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
    <line x1="976" y1="146" x2="976" y2="194" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
